name: staging
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

# Two jobs, not one. With upload and deploy in the same job, deploy-pages
# asked for the artifact a fraction of a second after it was finalized and
# GitHub sometimes did not list it yet ("No artifacts named github-pages"),
# failing the run until it was re-run (GOTCHAS 2026-11-25). The job boundary
# gives the artifact time to register; it is also GitHub's own Pages layout.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
